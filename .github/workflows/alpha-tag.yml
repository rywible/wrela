name: alpha-tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next alpha tag
        run: |
          set -euo pipefail
          version="$(awk -F' = ' '/^version = / { gsub(/"/, "", $2); print $2; exit }' crates/compiler/Cargo.toml)"
          prefix="v${version}-alpha."
          latest="$(git tag -l "${prefix}*" | sort -V | tail -n 1)"
          if [ -z "${latest}" ]; then
            next="1"
          else
            last="${latest##*.}"
            next="$((last + 1))"
          fi
          tag="${prefix}${next}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists"
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
