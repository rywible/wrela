name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["alpha-tag"]
    types:
      - completed

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            setup: linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve_tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            git fetch --tags
            tag="$(git tag -l 'v*' | sort -V | tail -n 1)"
          fi
          if [ -z "${tag}" ]; then
            echo "No tag found" >&2
            exit 1
          fi
          git checkout "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 linker
        if: matrix.setup == 'linux-aarch64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build runtime
        run: cargo build -p wrela_runtime --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.setup == 'linux-aarch64' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Build compiler
        run: cargo build -p wrela --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.setup == 'linux-aarch64' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib
          cp target/${{ matrix.target }}/release/wrela dist/bin/wrela
          cp target/${{ matrix.target }}/release/libwrela_runtime.a dist/lib/libwrela_runtime.a
          tar -czf wrela-${{ matrix.target }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: wrela-${{ matrix.target }}
          path: wrela-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: dist/*/*.tar.gz
