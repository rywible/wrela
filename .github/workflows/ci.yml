name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-22.04-arm64
            arch: aarch64
          - os: macos-14
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run runtime tests
        run: cargo test -p wrela_runtime

      - name: Run compiler tests
        run: cargo test -p wrela

      - name: Run platform v2 tests
        if: matrix.os == 'ubuntu-22.04-arm64'
        run: cargo test -p wrela_platform_v2

      - name: Run perf gate tests
        if: matrix.os == 'macos-14'
        run: python3 scripts/perf_gate_test.py

      - name: Run perf regression gate
        if: matrix.os == 'macos-14'
        env:
          WRELA_PERF_KEY: macos-aarch64
        run: python3 scripts/perf_gate.py
