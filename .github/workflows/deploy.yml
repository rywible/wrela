# Builds a release of the console, its games and the docs from each push to main
# (`wrela tool release`, studio/release) and deploys it to Cloudflare Workers (`wrela tool
# deploy`, studio/deploy, which runs Wrangler through `npx`). It builds with the toolchain release
# that the workspace pins (`toolchain` in wrela.toml), downloaded from rywible/wrela-compiler's
# GitHub release and checked against its SHA256SUMS; the release has its own Binaryen `wasm-opt`.
# It only ships: every check stays local (`wrela suite`). Its credentials are the `production`
# environment's, which only main can use; the deploy tool gives them to Wrangler alone.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, in push order; a deploy whose commit is no longer main's head stops.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Where `wrela` keeps the release it would download itself: ~/.wrela/toolchains/X.Y.Z.
      - name: The pinned toolchain
        run: |
          version=$(sed -n 's/^toolchain = "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' wrela.toml | head -n 1)
          if [ -z "$version" ]; then echo "error: wrela.toml pins no toolchain" >&2; exit 1; fi
          name="wrela-$version-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/rywible/wrela-compiler/releases/download/v$version"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$name"
          curl -fsSLO "$base/SHA256SUMS"
          grep "  $name\$" SHA256SUMS | sha256sum -c -
          dir="$HOME/.wrela/toolchains/$version"
          mkdir -p "$dir"
          tar xzf "$name" -C "$dir"
          echo "$dir/bin" >> "$GITHUB_PATH"

      # For Wrangler, which the deploy tool runs through `npx`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the release
        run: |
          wrela toolchain
          wrela tool release -- --revision "$GITHUB_SHA"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrela tool deploy -- --require-main-head
