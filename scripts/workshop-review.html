<!doctype html><html><meta charset="utf-8"><title>Workshop comparison</title>
<style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:24px;background:#151b23;color:#e4e8eb;font:14px system-ui}h1{font-size:24px}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap}select,button{padding:7px;background:#293443;color:inherit;border:1px solid #526174;border-radius:5px}label{display:flex;gap:8px;align-items:center}.viewport{overflow:auto;max-height:76vh;border:1px solid #526174;margin-top:18px}.frame{position:relative;width:100%;aspect-ratio:16/9}.frame img{position:absolute;width:100%;height:100%}.tag{position:absolute;top:12px;padding:6px 10px;background:#111b;pointer-events:none}#rightTag{right:12px}pre{white-space:pre-wrap;font:12px ui-monospace}summary{cursor:pointer;margin-top:18px}#status{margin:12px 0;color:#b6c3d0}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}.board figure{margin:0}.board img{width:100%;cursor:zoom-in}.board figcaption{padding:6px 0;color:#bccad4}#artBrief{max-width:1000px;line-height:1.6}.palette{display:flex;gap:14px;flex-wrap:wrap}.chip{width:28px;height:28px;display:inline-block;margin-right:6px;vertical-align:middle;border-radius:50%}#large{position:fixed;inset:0;background:#000e;z-index:10;overflow:auto;padding:24px}#large img{width:100%;cursor:zoom-out}</style>
<h1>Workshop · compare and inspect</h1><header>
<label>Study <select id="case"></select></label><label id="leftChoice">Left <select id="leftVariant"></select></label><label id="rightChoice">Right <select id="rightVariant"></select></label><label>Frame <input id="frame" type="range" min="0" max="0" value="0"></label>
<button id="previous">Previous frame</button><button id="next">Next frame</button><button id="play">Play sequence</button><label>Compare <input id="wipe" type="range" min="0" max="100" value="50"></label>
<span id="compareActions"><button id="baselineOnly">Baseline</button> <button id="split">Split</button> <button id="currentOnly">Current</button></span><label>Zoom <select id="zoom"><option value="1">Fit</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label></header>
<button id="overview" style="margin-top:12px">Show all current views</button><section id="artBrief" hidden></section><div id="status"></div><div id="board" class="board" hidden></div><div id="large" hidden></div><div class="viewport"><div class="frame" id="canvas"><img id="right"><img id="left"><span class="tag" id="leftTag"></span><span class="tag" id="rightTag"></span></div></div>
<details><summary>Exact study settings and source fingerprints</summary><pre id="metadata"></pre></details>
<script>const items=__ITEMS__;const art=__ART__;const byId=id=>document.getElementById(id);const keys=[...new Set(items.map(x=>x.condition+' / '+x.view))];let timer,overview=false;
function element(tag,text,parent){const e=document.createElement(tag);if(text)e.textContent=text;if(parent)parent.append(e);return e;}
if(art){const brief=byId('artBrief');brief.hidden=false;element('h2',art.name,brief);element('p',art.status,brief);const details=element('details','',brief);element('summary','Art direction · shape, materials, lighting and sky',details);for(const key of ['intent','shapeLanguage','detailBudget','materials','color','lighting'])if(art[key])element('p',art[key],details);const palette=element('div','',details);palette.className='palette';for(const c of art.palette||[]){const label=element('span','',palette),chip=element('span','',label);chip.className='chip';if(/^#[0-9a-f]{6}$/i.test(c.hex))chip.style.background=c.hex;label.append(document.createTextNode(c.name));}const questions=element('ul','',details);for(const q of art.reviewQuestions||[])element('li',q,questions);}
keys.forEach(k=>byId('case').add(new Option(k,k)));
function render(){const key=byId('case').value;const subset=items.filter(x=>x.condition+' / '+x.view===key);byId('frame').max=Math.max(...subset.map(x=>x.frame));const n=+byId('frame').value;const match=subset.filter(x=>x.frame===n);const variants=[...new Set(subset.map(x=>x.variant))];for(const [id,fallback] of [['leftVariant',variants[0]],['rightVariant',variants[variants.length-1]]]){const menu=byId(id),previous=menu.value;menu.replaceChildren(...variants.map(x=>new Option(x,x)));menu.value=variants.includes(previous)?previous:fallback;}const a=match.find(x=>x.variant===byId('leftVariant').value)||match[0],b=match.find(x=>x.variant===byId('rightVariant').value)||match[match.length-1];if(!a)return;byId('leftChoice').hidden=byId('rightChoice').hidden=variants.length<3||!!art;const compare=match.length>1&&!art,motion=+byId('frame').max>0;byId('wipe').parentElement.hidden=!compare;byId('compareActions').hidden=!compare;byId('frame').parentElement.hidden=!motion;byId('play').hidden=!motion;byId('previous').hidden=!motion;byId('next').hidden=!motion;byId('leftTag').hidden=!compare;byId('left').src=a.src;byId('right').src=b.src;byId('leftTag').textContent=a.variant;byId('rightTag').textContent=b.variant;byId('left').style.clipPath='inset(0 '+(100-byId('wipe').value)+'% 0 0)';byId('zoom').parentElement.hidden=!!art;byId('canvas').style.width=(+byId('zoom').value*100)+'%';byId('status').textContent=a.subject+' · '+key+' · frame '+(n+1)+' · time '+a.time.toFixed(3)+(compare?' / '+b.time.toFixed(3):'')+' s'+(a.creature&&a.creature.mode!=='bind'?' · '+a.creature.mode+' '+a.creature.seconds.toFixed(3)+' s'+(a.creature.mode==='behavior'?' · '+a.creature.actor.state+' · '+a.creature.actor.reason:''):'');byId('metadata').textContent=JSON.stringify(art?match:{left:a,right:b},null,2);
byId('overview').hidden=!!art;byId('canvas').parentElement.hidden=!!art||overview;byId('board').hidden=!art&&!overview;byId('board').style.gridTemplateColumns=overview?'repeat(4,minmax(0,1fr))':'';
if(art||overview){const board=byId('board');board.replaceChildren();const display=overview?items.filter(x=>x.variant===items[items.length-1].variant):match;for(const item of display){const f=element('figure','',board),img=element('img','',f);img.src=item.src;img.alt=item.variant+' · '+item.subject+' · '+item.condition+' / '+item.view;img.onclick=()=>{const large=byId('large');large.replaceChildren();element('p','Click image to return',large);const full=element('img','',large);full.src=item.src;large.hidden=false;large.onclick=()=>large.hidden=true;};element('figcaption',overview?item.condition+' / '+item.view+' · frame '+(item.frame+1):item.variant+' · '+item.subject+' · '+(item.subject==='sky'?'Atmosphere · shared scene look':item.height.toPrecision(3)+' m tall · individually framed'),f);}}}
for(const [id,value] of [['baselineOnly',100],['split',50],['currentOnly',0]])byId(id).onclick=()=>{byId('wipe').value=value;render()};
['case','frame','wipe','zoom','leftVariant','rightVariant'].forEach(id=>byId(id).addEventListener('input',()=>{if(id==='case')byId('frame').value=0;render()}));
byId('overview').onclick=()=>{overview=!overview;byId('overview').textContent=overview?'Return to comparison':'Show all current views';render()};
byId('previous').onclick=()=>{byId('frame').value=Math.max(0,+byId('frame').value-1);render()};byId('next').onclick=()=>{byId('frame').value=Math.min(+byId('frame').max,+byId('frame').value+1);render()};byId('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;byId('play').textContent='Play sequence'}else{timer=setInterval(()=>{byId('frame').value=(+byId('frame').value+1)%(+byId('frame').max+1);render()},250);byId('play').textContent='Pause sequence'}};render();</script></html>
