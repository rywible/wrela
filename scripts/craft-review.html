<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Creature craft review</title>
<style>*{box-sizing:border-box}body{background:#171b20;color:#e8dfd1;font:14px system-ui;margin:20px}h1{font-size:24px}button,select,input{margin:6px;padding:7px;accent-color:#d6ad73}button,select{background:#303a42;color:inherit;border:1px solid #52606a;border-radius:5px}main{display:grid;grid-template-columns:2fr 1fr;gap:16px}.views{display:grid;grid-template-columns:1fr 1fr;gap:8px}figure{margin:0}img{width:100%;display:block}figcaption{padding:6px}svg{width:100%;height:320px;background:#10151a}pre{white-space:pre-wrap;font-size:12px;color:#c2cbd0}.timeline{display:grid;gap:5px;margin-top:16px}.track{display:flex;align-items:center;gap:2px}.name{width:130px;flex-shrink:0}.bar{display:flex;flex:1;position:relative;min-width:0}.cursor{position:absolute;top:-3px;bottom:-3px;width:2px;background:#f6ce86;pointer-events:none}.cell{min-width:0;height:16px;flex:1;border:0;padding:0;margin:0;border-radius:0;cursor:pointer}.on{background:#95b399}.off{background:#334650}.selected{outline:2px solid #f6ce86}a{color:#e0b57d}.refs{padding:12px;border:1px solid #46525a}#slider{width:45%}@media(max-width:900px){main{grid-template-columns:1fr}.views{grid-template-columns:1fr}}</style>
<h1>Creature craft review</h1><p>Actual render captures and sampled motion. Scrub a moment to inspect its poses, support, and contact timing.</p>
<button id="play">Play</button><input id="slider" aria-label="Performance time" type="range" min="0" step="1"><b id="time"></b>
<main><section><div id="views" class="views"></div><div id="contacts" class="timeline"></div></section><aside>
<label>Trail <select id="joint"></select></label><label>Projection <select id="projection"><option value="side">Side</option><option value="front">Front</option><option value="above">Above / support</option></select></label>
<div id="reference"><label>Compare reference <select id="referenceSelect" aria-label="Reference media"><option value="">None</option></select></label><video id="referenceVideo" muted controls playsinline preload="metadata" style="width:100%;display:none"></video><img id="referenceImage" alt="Authored reference" style="display:none"><p id="referenceTime"></p></div>
<svg id="plot" viewBox="0 0 480 320" role="img" aria-label="Joint trajectories and support polygon"></svg><pre id="metrics"></pre></aside></main>
<h2>Authored references</h2><div id="refs" class="refs"></div><p><a href="report.json">Complete diagnostics</a> · <a href="study.json">Replay study</a> · <a href="craft.json">Authored source and schema</a></p><pre id="scope"></pre>
<dialog id="enlarged" style="width:95vw;padding:8px;background:#171b20;color:#e8dfd1;border:1px solid #52606a"><button onclick="document.getElementById('enlarged').close()">Close enlarged render</button><img id="enlargedImage" alt="Enlarged creature render"></dialog>
<script>
const report=CRAFT_PAYLOAD, $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';let frame=0,timer,playStart=0,playOffset=0;
$('slider').max=report.samples.length-1;$('slider').value=0;
for(const id of Object.keys(report.samples[0].joints).sort()){let option=document.createElement('option');option.textContent=id;$('joint').append(option)}$('joint').value=Object.keys(report.samples[0].joints).includes('mask')?'mask':Object.keys(report.samples[0].joints)[0];
let selectedReference=null;
for(const [i,track] of (report.referenceTracks||[]).entries()){const option=document.createElement('option');option.value=i;option.textContent=track.locator.split('/').pop();$('referenceSelect').append(option)}
function syncReference(time){if(!selectedReference)return;const markers=selectedReference.markers;let marker=markers[0],sourceTime=marker.sourceTime+(time-marker.timelineTime)*marker.sourceRate;
for(let i=1;i<markers.length;i++){const a=markers[i-1],b=markers[i];if(time>=a.timelineTime&&time<=b.timelineTime&&b.timelineTime>a.timelineTime){sourceTime=a.sourceTime+(b.sourceTime-a.sourceTime)*(time-a.timelineTime)/(b.timelineTime-a.timelineTime);break}if(time>b.timelineTime){marker=b;sourceTime=b.sourceTime+(time-b.timelineTime)*b.sourceRate}}
const video=$('referenceVideo');if(video.style.display!=='none'&&video.readyState>=1){video.pause();video.currentTime=Math.min(Math.max(0,sourceTime),video.duration||sourceTime)}$('referenceTime').textContent='Reference '+Math.max(0,sourceTime).toFixed(3)+' s';}
$('referenceSelect').onchange=()=>{const value=$('referenceSelect').value,video=$('referenceVideo'),image=$('referenceImage');video.pause();video.removeAttribute('src');image.removeAttribute('src');video.style.display=image.style.display='none';selectedReference=value===''?null:report.referenceTracks[+value];if(selectedReference){const locator=selectedReference.locator;if(/^(https?:\/\/|file:\/\/\/|\/)/.test(locator)){if(/\.(mp4|m4v|mov|webm)(?:[?#].*)?$/i.test(locator)){video.style.display='block';video.src=locator;video.onloadedmetadata=()=>syncReference(report.samples[frame].time)}else if(/\.(png|jpe?g|webp)(?:[?#].*)?$/i.test(locator)){image.style.display='block';image.src=locator}}}render()};
function el(tag,attrs){let e=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);$('plot').append(e);return e}
function render(){frame=+$('slider').value;const row=report.samples[frame];$('time').textContent=row.time.toFixed(3)+' s';syncReference(row.time);$('views').replaceChildren();
for(let view of report.views){let r=report.records.find(r=>r.view===view&&r.index===frame),f=document.createElement('figure'),im=document.createElement('img'),caption=document.createElement('figcaption');im.src=r.image;im.alt=view+' render at '+row.time.toFixed(3)+' seconds';im.style.cursor='zoom-in';im.onclick=()=>{const dialog=$('enlarged');$('enlargedImage').src=im.src;$('enlargedImage').alt=im.alt;dialog.showModal()};caption.textContent=view;f.append(im,caption);$('views').append(f)}
const projection=$('projection').value;function pair(p){return projection==='side'?[-p[2],p[1]]:projection==='front'?[p[0],p[1]]:[p[0],-p[2]]}
const all=report.samples.flatMap(r=>Object.values(r.joints).map(pair));const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),lo=[Math.min(...xs)-.3,Math.min(...ys)-.3],hi=[Math.max(...xs)+.3,Math.max(...ys)+.3];const scale=Math.min(450/(hi[0]-lo[0]),280/(hi[1]-lo[1]));function project(p){const q=pair(p);return [20+(q[0]-lo[0])*scale,300-(q[1]-lo[1])*scale]}$('plot').replaceChildren();
const trail=report.samples.map(r=>project(r.joints[$('joint').value]));el('polyline',{points:trail.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#d6ad73','stroke-width':2});
for(const j of report.rig){const p=row.joints[j.id],parent=row.joints[j.parent];if(parent&&p){const a=project(parent),b=project(p);el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#73969a','stroke-width':2})}}
for(const p of Object.values(row.joints)){const q=project(p);el('circle',{cx:q[0],cy:q[1],r:3,fill:'#d8e0df'})}
if(selectedReference){const marker=selectedReference.markers.reduce((a,b)=>Math.abs(a.timelineTime-row.time)<Math.abs(b.timelineTime-row.time)?a:b);if(Math.abs(marker.timelineTime-row.time)<.2){for(const [id,p] of Object.entries(marker.landmarks||{})){const q=project(p);el('path',{d:`M${q[0]-5},${q[1]-5}L${q[0]+5},${q[1]+5}M${q[0]+5},${q[1]-5}L${q[0]-5},${q[1]+5}`,stroke:'#ee856d','stroke-width':2});if(row.joints[id]){const actual=project(row.joints[id]);el('line',{x1:q[0],y1:q[1],x2:actual[0],y2:actual[1],stroke:'#ee856d','stroke-dasharray':'3 3'})}}}}
const focus=trail[frame];el('circle',{cx:focus[0],cy:focus[1],r:6,fill:'#efba72'});
if(projection==='above'&&report.hasMassModel){const support=row.support.supportPolygon.map(p=>project([p[0],0,p[1]]));if(support.length>1)el('polygon',{points:support.map(p=>p.join(',')).join(' '),fill:'#84ab8825',stroke:'#95b399'});const center=project(row.support.centerOfMass);el('circle',{cx:center[0],cy:center[1],r:6,fill:row.support.supported?'#9ece93':'#ee856d'})}
$('contacts').replaceChildren();const ids=report.samples[0].contacts.map(c=>c.id);
for(const id of ids){const line=document.createElement('div'),label=document.createElement('span'),bar=document.createElement('div');line.className='track';label.className='name';label.textContent=id;bar.className='bar';line.append(label,bar);
let start=0;while(start<report.samples.length-1){const planted=!!report.samples[start].contacts.find(c=>c.id===id)?.planted;let end=start+1;while(end<report.samples.length-1&&!!report.samples[end].contacts.find(c=>c.id===id)?.planted===planted)end++;
const from=report.samples[start].time,to=report.samples[end].time,index=start,b=document.createElement('button');b.className='cell '+(planted?'on':'off');b.style.flex=String(Math.max(0,to-from));b.title=id+' '+from.toFixed(2)+'–'+to.toFixed(2)+' s: '+(planted?'planted':'moving');b.setAttribute('aria-label',b.title);b.onclick=()=>{stop();$('slider').value=index;render()};bar.append(b);start=end}
const cursor=document.createElement('span');cursor.className='cursor';cursor.style.left=(100*row.time/report.duration)+'%';bar.append(cursor);$('contacts').append(line)}
$('metrics').textContent='Peak joint speed here: '+row.maximumJointSpeed.toFixed(2)+' m/s\nPeak joint acceleration: '+row.maximumJointAcceleration.toFixed(2)+' m/s²\n'+(report.hasMassModel?'Mass: '+row.support.totalMass.toFixed(1)+' kg\nOutside support: '+(row.support.outsideDistance*1000).toFixed(1)+' mm\nSupport polygon: '+row.support.supportPolygon.length+' corners':'No mass model; support assessment unavailable.')+'\n'+row.deformation.map(d=>d.part+': edge stretch '+d.metrics.maximumStretch.toFixed(3)+'×; minimum area '+d.metrics.minimumAreaRatio.toFixed(3)+'×; reversed triangles '+d.metrics.reversedTriangles).join('\n');
$('refs').replaceChildren();if(!report.references.length)$('refs').textContent='No reference annotations authored.';for(const r of report.references){let p=document.createElement('p');p.textContent=r.id+' · source '+r.sourceTime.toFixed(2)+' s / phrase '+r.phraseTime.toFixed(2)+' s — '+r.note;if(/^(https?:\/\/|\/)/.test(r.locator)){let a=document.createElement('a');a.textContent=' Open reference';a.href=r.locator;a.rel='noopener';a.target='_blank';p.append(a)}$('refs').append(p)}
}
function stop(){if(timer)cancelAnimationFrame(timer);timer=null;$('play').textContent='Play'}
$('slider').oninput=()=>{stop();render()};$('joint').onchange=render;$('projection').onchange=render;$('scope').textContent=report.scope;
function tick(now){const time=(playOffset+(now-playStart)/1000)%report.duration;let index=0;while(index+1<report.samples.length&&report.samples[index+1].time<=time)index++;if(index!==frame){$('slider').value=index;render()}syncReference(time);timer=requestAnimationFrame(tick)}
$('play').onclick=()=>{if(timer){stop()}else{playOffset=report.samples[frame].time;playStart=performance.now();$('play').textContent='Pause';timer=requestAnimationFrame(tick)}};render();
</script></html>
