<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike 06: crowds and edits</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1c1a; --muted: #6b6862; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #e9e7e3; --muted: #9a968f; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  canvas { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; display: block; background: #000; }
  pre { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
  button { font: inherit; padding: 6px 14px; }
</style>
</head>
<body>
  <h1>Spike 06: crowds and live edits</h1>
  <p>A town square, 300 moving things and a stream of world edits, ray-marched: the world from a brick cache, the crowd binned per tile.</p>
  <p><button id="run">Run all</button> <code>#run</code> measures everything; <code>#quick</code> renders each scene once.</p>
  <canvas id="view" width="1920" height="1080"></canvas>
  <pre id="log"></pre>
  <script type="module" src="main.js"></script>
</body>
</html>
