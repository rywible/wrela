<!doctype html><meta charset="utf-8"><title>probe</title><pre id="out">probing…</pre>
<script type="module">
const out = document.getElementById('out');
const r = { ua: navigator.userAgent, gpu: !!navigator.gpu };
try {
  const a = await navigator.gpu?.requestAdapter({ powerPreference: 'high-performance' });
  if (a) {
    r.features = [...a.features].sort();
    r.limits = { maxStorageBufferBindingSize: a.limits.maxStorageBufferBindingSize, maxBufferSize: a.limits.maxBufferSize,
      maxComputeInvocationsPerWorkgroup: a.limits.maxComputeInvocationsPerWorkgroup, maxStorageBuffersPerShaderStage: a.limits.maxStorageBuffersPerShaderStage,
      maxComputeWorkgroupStorageSize: a.limits.maxComputeWorkgroupStorageSize };
    r.info = a.info ? { vendor: a.info.vendor, architecture: a.info.architecture, description: a.info.description } : null;
  }
} catch (e) { r.error = String(e); }
out.textContent = JSON.stringify(r, null, 2);
window.__probe = r;
</script>
