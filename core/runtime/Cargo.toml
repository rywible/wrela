[package]
name = "wrela_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["metrics"]
metrics = []

[dependencies]
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.10"
