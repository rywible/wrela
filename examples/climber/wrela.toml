# The climber and its fight with round 1's wolf (#30): a masked figure that is a cape all the way
# round, with no arms or legs, and a great sword it moves by will. Its moves are keyed as code
# with their frame data (the sword's path and the body's form), and the fight's sim reads a
# gamepad's presses as tick records. examples/climber-arena draws the fight from above.
[package]
name = "climber"

[dependencies]
engine = { path = "../../engine" }
clearing = { path = "../clearing" }
wolf = { path = "../wolf" }
