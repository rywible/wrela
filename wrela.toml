# The workspace: every wrela package of the project but the toolchain's own (compiler/std and
# compiler/tests), which depend on each other by name (`engine = { workspace = true }`). The
# directory itself isn't a package. `wrela suite` checks it all: the members' format, the
# allowlist below and every member's tests (spec/language.md §3.6, §23.9).
[workspace]
# The toolchain release the workspace runs: a `wrela` of another release runs this one instead,
# downloading it to ~/.wrela/toolchains (`wrela toolchain` says which runs and why).
toolchain = "0.32.0"
members = [
    "console",
    "console/server",
    "console/tests/shader-budget",
    "content/*",
    "docsite",
    "docsite/tests/reader",
    "engine",
    "engine/tests/*",
    "scenes/opening",
    "scenes/opening/tests/*",
    "land",
    "land/tests/*",
    "mmo/combat",
    "mmo/game",
    "mmo/island",
    "platform",
    "studio/audio",
    "studio/bench",
    "studio/passes",
    "studio/lookbook",
    "studio/styles",
    "studio/motion",
    "studio/moves",
    "studio/serve",
    "studio/steady",
    "studio/release",
    "studio/deploy",
    "studio/costs",
    "studio/toolkit",
    "ui",
    "ui/brand",
    "ui/tests/*",
]
# The files the workspace may hold: wrela sources and manifests, assets with their licences, a
# game's theme, the prose, and the CI files. Each of the `wrela` repository's files is one of
# these.
allow = [
    "**/*.wrela",
    "**/wrela.toml",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.webp",
    "**/*.ttf",
    "**/*.otf",
    "**/*.obj",
    "**/*.stl",
    "**/*.glb",
    "**/*.bvh",
    "**/*.wav",
    "**/LICENSE*",
    "**/OFL-*.txt",
    "**/*.LICENSE.txt",
    "AGENTS.md",
    "README.md",
    "docs/vision.md",
    "docs/citations.md",
    "docs/toolchain.md",
    "docs/toolchain-gaps.md",
    "docs/plan-world-class.md",
    "docs/bench.md",
    "docs/world-class-next.md",
    "docs/plan-world-class-2.md",
    "docs/plan-world-class-3.md",
    "docs/plan-online-play.md",
    "docs/voice.md",
    "docs/lookdev.md",
    "docs/devices.md",
    "content/styles/README.md",
    "studio/styles/history.log",
    "content/humanoid/assets/accad_male2_arm_shapes.bin",
    ".gitignore",
    ".github/workflows/deploy.yml",
    ".github/workflows/costs.yml",
]

# The audio tool (studio/audio): a piece's take as a WAV file, its notes, numbers, MIDI and
# sheet, and measurements of recordings (a note's partials, a piano model, clicks). It builds a
# piece in its `build/audio` and writes where its command line says, in the workspace.
[tools.audio]
package = "studio/audio"
write = ["ws=."]

# The lookbook tool (studio/lookbook): each shot of a scene's lookbook as a still on the native
# host's GPU and a clip in Chrome. It builds the scene's package, serves it to Chrome and writes
# the clips' keys and the page's results in its build, and writes the stills and clips where its
# command line says, in the workspace.
[tools.lookbook]
package = "studio/lookbook"
write = ["ws=."]
browser = true

# The motion tool (studio/motion): short captures of a scene in motion on the native host's GPU.
# It reads the scene's build and writes each capture's frames, clip and contact sheet where its
# command line says, in the workspace. FFmpeg (with x264) makes the clips: it isn't vendored, so
# it must be on PATH (`brew install ffmpeg`, or the distribution's `ffmpeg` package).
[tools.motion]
package = "studio/motion"
write = ["ws=."]
run = ["ffmpeg"]

# The steady tool (studio/steady): how unsteady a scene's picture is while its camera moves (its
# crawl, kind of pixel by kind, against a reference of the same frames), on the native host's
# GPU. It builds the scene's package where its command line says, in the workspace, and writes
# its table and each build's heat there.
[tools.steady]
package = "studio/steady"
write = ["ws=."]

# The moves tool (studio/moves): a reference capture's clip fitted as motion written in Wrela,
# written into content/moves.
[tools.moves]
package = "studio/moves"
write = ["ws=."]

# The bench tool (studio/bench): what the engine's scenes cost on this machine, in headless
# Chrome and natively. It reads the workspace's packages and builds each into build/bench, and
# adds its table to docs/bench.md, so it writes the workspace.
[tools.bench]
package = "studio/bench"
write = ["ws=.", "out=build/bench"]
browser = true

# The pass viewer (studio/passes): a frame's passes and dispatches, in order, as a page served on
# this machine (`wrela tool passes -- <pkg> --frame <n>`).
[tools.passes]
package = "studio/passes"
read = ["ws=."]
write = ["out=build/passes"]
browser = true

# The styles tool (studio/styles): each look under content/styles built into a scene, the
# G-style check on the history (`git log`), and the looks' page.
[tools.styles]
package = "studio/styles"
write = ["ws=."]
run = ["git"]

# The serve tool (studio/serve): a directory of the workspace served to a browser on this
# machine, its pages' results written into its `results/`.
[tools.serve]
package = "studio/serve"
write = ["ws=."]

# The release tool (studio/release): a release of the console, its games and the docs for
# Cloudflare Workers, which the deploy tool deploys. It reads the workspace, stages its builds in
# build/release-work and writes the release in build/release, which must be empty.
[tools.release]
package = "studio/release"
read = ["ws=."]
write = ["out=build/release", "work=build/release-work"]
# 90 minutes: a cold build on CI's 4-core runner; its builds may take most of it
# (studio/release/main.wrela's BUILD_TIMEOUT).
timeout = 5400

# The costs tool (studio/costs): the Cloudflare account's use this month against the plan's free
# allowances, read from Cloudflare's analytics; it exits 1 with an alarm when a meter or the bill
# is on pace past its limit. The costs workflow runs it each day.
[tools.costs]
package = "studio/costs"
net = ["api.cloudflare.com"]
secrets = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]

# The deploy tool (studio/deploy): deploys the release in build/release to Cloudflare Workers,
# keeping the releases live clients may still use in each Worker's assets. It writes the history,
# and the kept releases it fetches from the live site (the catalog's domains,
# studio/release/catalog.wrela), into the release, reads main's head on GitHub, and runs Wrangler
# through `npx` to deploy, with Cloudflare's secrets, which only Wrangler gets.
[tools.deploy]
package = "studio/deploy"
write = ["release=build/release"]
net = ["wrela.dev", "docs.wrela.dev", "github.com"]
run = ["npx"]
secrets = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "WRELA_ACCESS_CLIENT_ID", "WRELA_ACCESS_CLIENT_SECRET"]
timeout = 3600
