# The workspace: every wrela package of the project but the toolchain's own (compiler/std and
# compiler/tests), which depend on each other by name (`engine = { workspace = true }`). The
# directory itself isn't a package. `wrela suite` checks it all: the members' format, the
# allowlist below and every member's tests (spec/language.md §3.6, §23.9).
[workspace]
members = [
    "console",
    "console/tests/shader-budget",
    "content/*",
    "docsite",
    "docsite/tests/reader",
    "engine",
    "engine/tests/*",
    "examples/*",
    "examples/clearing/tests/checks",
    "examples/clusters/tests/cuts",
    "examples/gymnopedie/tests/piece",
    "examples/herd/tests/layers",
    "examples/herd/tests/raycasts",
    "examples/herd/tests/realize",
    "games/*",
    "games/last-green/session",
    "games/last-green/session/tests/export",
    "games/last-green/stair",
    "games/last-green/test-floor",
    "games/last-green/tests/map",
    "games/last-green/tests/stair",
    "games/leapling/session",
    "platform",
    "references",
    "studio",
    "studio/glue",
    "studio/maplens",
    "studio/maplens/glue",
    "studio/audio",
    "studio/reference",
    "studio/release",
    "studio/deploy",
    "studio/tests/views",
    "studio/tool",
    "ui",
    "ui/brand",
    "ui/tests/*",
]
# The files the workspace may hold: wrela sources and manifests, assets with their licences, the
# prose, and the one CI file. Each of the `wrela` repository's files is one of these.
allow = [
    "**/*.wrela",
    "**/wrela.toml",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.webp",
    "**/*.ttf",
    "**/*.otf",
    "**/*.obj",
    "**/*.stl",
    "**/*.wav",
    "**/LICENSE*",
    "**/OFL-*.txt",
    "**/*.LICENSE.txt",
    "AGENTS.md",
    "README.md",
    "docs/vision.md",
    "docs/process.md",
    ".gitignore",
    ".github/workflows/deploy.yml",
]
# The toolchain's files, which go to `wrela-compiler` when the repository splits: until then the
# allowlist check doesn't look at them. The split removes this list.
exclude = [
    "compiler/**",
    "runtime/**",
    "spec/**",
    "tools/**",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "rustfmt.toml",
]
# Files that the split's plan still removes or makes wrela values: reported, not refused, until
# they go. The split removes this list.
pending = [
    ".claude/launch.json",
]

# The studio's tool (studio/tool): the lens on a subject, built, served and run headless. It
# reads the workspace and writes a subject's literals back through `wrela edit`'s code, so it
# writes the workspace; its own output goes in build/studio.
[tools.studio]
package = "studio/tool"
write = ["ws=.", "out=build/studio"]

# The reference tool (studio/reference): replicas of reference meshes as packages, and how far a
# package's surface is from its mesh's. It writes a replica where its command line says, in the
# workspace; the packages it measures are built in build/reference.
[tools.reference]
package = "studio/reference"
write = ["ws=.", "out=build/reference"]

# The audio tool (studio/audio): a piece's take as a WAV file, its notes, numbers, MIDI and
# sheet, and measurements of recordings (a note's partials, a piano model, clicks). It builds a
# piece in its `build/audio` and writes where its command line says, in the workspace.
[tools.audio]
package = "studio/audio"
write = ["ws=."]

# The release tool (studio/release): a release of the console, its games and the docs for
# Cloudflare Workers, which the deploy tool deploys. It reads the workspace, stages its builds in
# build/release-work and writes the release in build/release, which must be empty.
[tools.release]
package = "studio/release"
read = ["ws=."]
write = ["out=build/release", "work=build/release-work"]
# 90 minutes: a cold build on CI's 4-core runner (each of The Last Green's histories bakes for
# minutes). Its builds may take most of it (studio/release/main.wrela's BUILD_TIMEOUT).
timeout = 5400

# The deploy tool (studio/deploy): deploys the release in build/release to Cloudflare Workers,
# keeping the releases live clients may still use. It writes the kept releases and the history
# into the release, reads the live site (the catalog's domains, studio/release/catalog.wrela) and
# main's head on GitHub, and runs Wrangler through `npx` with Cloudflare's secrets, which only
# Wrangler gets.
[tools.deploy]
package = "studio/deploy"
write = ["release=build/release"]
net = ["wrela.dev", "docs.wrela.dev", "leapling.wrela.dev", "last-green.wrela.dev", "github.com"]
run = ["npx"]
secrets = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]
timeout = 3600
