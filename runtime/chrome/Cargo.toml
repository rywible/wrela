[package]
name = "wrela-chrome"
description = "Chrome stable driven over the DevTools protocol: headless, a hardware GPU, a throwaway profile in a process group of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The keys a script presses, by the numbers `std::input::Key` gives them.
wrela-abi.workspace = true
serde_json.workspace = true
# The DevTools protocol's WebSocket, on loopback: the client handshake alone, no TLS.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# A screenshot's PNG, which DevTools sends as base64; already in the tree.
base64 = "0.22"
# `WRELA_CHROME_ARGS`, split as a shell splits it; already in the tree.
shlex = "2"
# Chrome's process group, signalled without `unsafe`; already in the tree.
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
