[package]
name = "wrela-host"
description = "The native host: runs a built wrela program's WASM (wasmtime) and command stream (wgpu), headless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wrela-host"
path = "src/main.rs"

[dependencies]
wrela-abi.workspace = true
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "0.4"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wat = "1.260"

[lints]
workspace = true
