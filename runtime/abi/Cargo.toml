[package]
name = "wrela-abi"
description = "The contract between compiled wrela programs and their hosts: the program ABI, the command stream, the manifest and the state hash"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[[bin]]
name = "generate"
path = "src/bin/generate.rs"
test = false

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
