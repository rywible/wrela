[package]
name = "wrela_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["metrics"]
metrics = []
abi_typed_fast_path = []

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
