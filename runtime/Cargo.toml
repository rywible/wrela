[package]
name = "wrela_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["metrics"]
metrics = []
abi_typed_fast_path = []

[target.'cfg(all(not(target_env = "msvc"), target_os = "linux"))'.dependencies]
tikv-jemallocator = "0.6"

[dependencies]
argon2 = "0.5"
axum = "0.8"
bytes = { version = "1", features = ["serde"] }
prost = "0.13"
tonic = "0.12"
aws-config = "1.8"
aws-sdk-s3 = "1.115"
base64 = "0.22"
bincode = "1.3"
dashmap = "6.1"
hickory-resolver = "0.24"
httparse = "1.9"
libc = "0.2"
mio = { version = "0.8", features = ["os-poll", "os-ext"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
crc32fast = "1"
crossbeam-channel = "0.5"
flume = "0.11"
libloading = "0.8"
smallvec = "1.13"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
