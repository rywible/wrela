<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wrela</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  #wrela-status { position: fixed; left: 8px; bottom: 8px; margin: 0; max-width: calc(100% - 16px); color: #ddd; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  #wrela-status:empty { display: none; }
  #wrela-status[data-state="error"] { color: #ff8a80; }
</style>
</head>
<body>
<canvas id="wrela-screen"></canvas>
<pre id="wrela-status" role="status"></pre>
<script type="module" src="wrela.js"></script>
</body>
</html>
