[package]
name = "wrela-serve"
description = "The server host: a server build's rooms over WebTransport, kept durably"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wrela-serve"
path = "src/main.rs"
test = false

[dependencies]
wrela-abi.workspace = true
# The rooms and their journals; a server has no GPU.
wrela-host = { path = "../native", default-features = false }
# WebTransport (HTTP/3 over QUIC, TLS 1.3) and the async runtime it runs on.
wtransport = { version = "0.7", features = ["self-signed"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
