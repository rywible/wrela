# The Last Green's tests that fail on a question of what the game should do, held apart until
# Ryan answers it: `wrela suite` runs them only when named (`untested`, root wrela.toml), and the
# floor's other tests run in the suite. Each test's comment says what it asks. An answered one
# goes back to the floor's tests.wrela (or goes), and this package with the last of them.
[package]
name = "last_green_open_questions"

[dependencies]
engine = { workspace = true }
last_green = { workspace = true }
