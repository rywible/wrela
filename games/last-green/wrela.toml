# The Last Green's floor (#54, #55): about 3 km² of the flagship's first floor round the
# clearing, composed as a map (map.wrela), grown by a history baked when the game is built
# (bake.wrela), streamed round the player, with water, the climber as the player and its camera,
# and the look M5 picked. The game's package until the flagship has a home of its own.
[package]
name = "last_green"

[dependencies]
climber = { workspace = true }
clouds = { workspace = true }
engine = { workspace = true }
fawn = { workspace = true }
great_tree = { workspace = true }
kit = { workspace = true }
land = { workspace = true }
platform = { workspace = true }
tower = { workspace = true }
wolf = { workspace = true }
