# The stair and its doors (games/last-green/stair, games/last-green/test-floor, engine::tower)
# in the native host, the builds side by side as a game ships them: the player climbs to the
# second door, which opens once the first world is decided, walks through to the test floor,
# frees it, and walks back out; the freed world's door is gone, from then on and over a reload;
# and the first floor's door returns to its landing. The tool tests build each floor through
# `std::tool::toolchain` and drive the stair on the GPU, handing over between the builds.
[package]
name = "stair_tour"
