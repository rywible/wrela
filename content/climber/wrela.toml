# The climber and its fight with round 1's wolf (#30): an empty black robe that hangs all the way
# round, with no visible body, and a great sword it moves by will. Its moves are keyed as code
# with their frame data (the sword's path and the body's form), and the fight's sim reads a
# gamepad's presses as tick records. examples/climber-arena draws the fight from above.
[package]
name = "climber"

[dependencies]
engine = { workspace = true }
wolf = { workspace = true }
