[workspace]
resolver = "3"
members = [
    "compiler/diag",
    "compiler/syntax",
    "compiler/grammar",
    "compiler/sema",
    "compiler/driver",
    "compiler/cli",
    "compiler/ir",
    "compiler/lower",
    "compiler/wasm",
    "compiler/wgsl",
    "compiler/tests",
    "runtime/abi",
    "runtime/native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
wrela-diag = { path = "compiler/diag" }
wrela-syntax = { path = "compiler/syntax" }
wrela-sema = { path = "compiler/sema" }
wrela-driver = { path = "compiler/driver" }
wrela-abi = { path = "runtime/abi" }
wrela-host = { path = "runtime/native" }
wrela-ir = { path = "compiler/ir" }
wrela-lower = { path = "compiler/lower" }
wrela-wasm = { path = "compiler/wasm" }
wrela-wgsl = { path = "compiler/wgsl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Syntax trees and IR enums are built once and walked; boxing the big variants would cost more
# indirection than the memory it saves.
large_enum_variant = "allow"

[profile.release]
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2
