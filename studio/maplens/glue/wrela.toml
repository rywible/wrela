# The map lens's program (`wrela tool studio` on a floor): the map lens on a floor. `wrela tool
# studio -- <floor>` builds a copy of it whose `floor.wrela` is the floor's; this one's is the
# Last Green's, so it checks alone.
[package]
name = "map"

[dependencies]
maplens = { workspace = true }
engine = { workspace = true }
last_green = { workspace = true }
