[package]
name = "wrela_client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Browser wasm client runtime for protocol-v4 sessions"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1"
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wrla_asset_pack = { package = "wrela_asset_pack", path = "../asset_pack" }
wrela_material_graph = { path = "../material_graph" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioListener",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterOptions",
    "BiquadFilterType",
    "BinaryType",
    "console",
    "CssStyleDeclaration",
    "DelayNode",
    "DelayOptions",
    "DistanceModelType",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "GainNode",
    "GainOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlHeadElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Node",
    "OscillatorNode",
    "OscillatorOptions",
    "OscillatorType",
    "PannerNode",
    "PannerOptions",
    "PanningModelType",
    "Response",
    "Window",
    "WebSocket",
    "WheelEvent",
] }
wgpu = { version = "24", features = ["wgsl", "webgpu"] }
