version = 1
suite = "collision_perf"

[profiles.smoke]
warmup_pairs = 2
measure_pairs = 6
coverage = "critical"

[profiles.standard]
warmup_pairs = 3
measure_pairs = 10
coverage = "all"

[profiles.deep]
warmup_pairs = 5
measure_pairs = 18
coverage = "all"

[[scenarios]]
id = "collision_perf_point_occupancy_burst"
test_name = "tests/collision_perf::test_collision_perf_point_occupancy_burst_ops_80000"
ops = 80000
class = "critical"
min_runtime_ms = 900
timeout_ms = 180000
allow_unstable = false
collision = { entry = "tests/collision_perf_test.wr", region = "collision_perf_region", domain = "collision_perf_domain", workload = "point_occupancy_burst" }

