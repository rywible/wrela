version = 1
suite = "linux"
optional = true

[profiles.smoke]
warmup_pairs = 2
measure_pairs = 6
coverage = "all"

[profiles.standard]
warmup_pairs = 3
measure_pairs = 10
coverage = "all"

[profiles.deep]
warmup_pairs = 5
measure_pairs = 18
coverage = "all"

[[scenarios]]
id = "reactor_timer_fanout_latency"
