version = 1
suite = "realtime_presentation"

[profiles.closure_1080p120]
warmup_pairs = 4
measure_pairs = 12
coverage = "all"
execution_story = "wgsl_resident"
adapter_name = "wgsl_resident"
enabled_optional_features = []
timestamps_enabled = false
f16_enabled = false
indirect_dispatch_enabled = false
warmup_protocol = "pipeline_and_resident_scene_upload"
companion_profile = "canonical_1080p120_cpu_oracle"

# Dense constructive closure lane: stresses candidate selection, hit resolution,
# and normal stability under the fixed 1080p120 presentation protocol.
[[scenarios]]
id = "closure_1080p120_dense_constructive"
test_name = "tests/realtime_presentation::test_realtime_presentation_dense_constructive_1080p120_closure_ops_256"
ops = 256
class = "closure"
min_runtime_ms = 250
timeout_ms = 180000
allow_unstable = false
presentation = { entry = "tests/realtime_presentation_test.wr", view = "show_dense_constructive_1080p120_closure_view", region = "dense_constructive_region", domain = "dense_constructive_domain", width = 1920, height = 1080, frames = 2, camera_position = [0.0, 0.0, 3.4], camera_forward = [0.0, 0.0, -1.0], camera_up = [0.0, 1.0, 0.0], vertical_fov_degrees = 46.0 }

