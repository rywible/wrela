[package]
name = "wrela_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["metrics"]
metrics = []
test-utils = []

[dependencies]
aws-config = "1.5"
aws-credential-types = "1.2"
aws-sdk-s3 = "1.54"
aws-types = "1.2"
axum = { version = "0.7", features = ["json"] }
bincode = "1.3"
byteorder = "1.5"
openraft = { version = "0.9", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
rocksdb = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"

[[test]]
name = "storage_commit_semantics"
path = "tests/storage_commit_semantics.rs"
required-features = ["test-utils"]
