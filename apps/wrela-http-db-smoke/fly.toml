app = "wrela-http-db-smoke"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[env]
  PRIMARY_REGION = "ord"
  WRELADB_TARGET_VOTERS = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 3
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/live"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
