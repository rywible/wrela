app = "wrela-hunyuan3d"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "30m"

[env]
  PORT = "8081"
  HF_HOME = "/data/hf"
  HUGGINGFACE_HUB_CACHE = "/data/hf/hub"
  TORCH_HOME = "/data/torch"
  HY3D_CACHE_PATH = "/data/gradio_cache"
  # Keep API simple and deterministic: one request at a time until we benchmark.
  HY3D_EXTRA_ARGS = "--limit-model-concurrency 1"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 4
    soft_limit = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "15s"
    path = "/health"

[[mounts]]
  source = "hunyuan_data"
  destination = "/data"

[[vm]]
  size = "a10"
