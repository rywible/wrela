app = "wrela-smoke-20260224112005"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[env]
  PRIMARY_REGION = "ord"
  WRELADB_DATA_DIR = "/data/wreladb"
  WRELADB_TARGET_VOTERS = "3"
  WRELADB_PRIVATE_RPC_ENABLED = "1"
  WRELADB_PRIVATE_RPC_PORT = "19091"
  WRELADB_PRIVATE_RPC_MTLS_MODE = "off"
  WRELADB_PRIVATE_RPC_TRUSTED_NETWORK = "fly-wireguard"
  WRELADB_PRIVATE_RPC_MIN_READY_NODES = "3"
  WRELADB_PRIVATE_RPC_DISCOVERY_REFRESH_MS = "5000"
  WRELADB_PRIVATE_RPC_DISCOVERY_TIMEOUT_MS = "1000"
  WRELADB_REGION_MACHINE_MAP_JSON = "{\"ord\":3}"
  WRELADB_CHECKPOINT_ALLOWED_REGIONS = "ord"
  WRELADB_CHECKPOINT_BACKEND = "file"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 3
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/api/live"

  [[http_service.machine_checks]]
    image = "curlimages/curl:8.7.1"
    entrypoint = ["/bin/sh", "-c"]
    command = ["for i in $(seq 1 60); do curl -fsS --connect-timeout 3 --max-time 5 http://[$FLY_TEST_MACHINE_IP]:8080/api/live >/dev/null && exit 0; sleep 1; done; exit 1"]
    kill_signal = "SIGKILL"
    kill_timeout = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
