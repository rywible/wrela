# The parts of a replica of sculpt-standing.obj, for `wrela reference replica`: a loft per
# part, on a straight axis inside the sculpt. Landmarks are in the creature's frame (metres,
# +y up, facing +z, +x the wolf's left), measured on the registered sculpt by slicing it; the
# sculpt is mirror-symmetric, so the right side's are the left's with x negated. The rump has a
# cleft on the midline under the tail, so the torso stops before it and a buttock on each side
# goes on, and the tail's root runs back along the top (below a crease on its crest) before it
# turns down. A fore paw's inner and outer toes have parts of their own: from the paw's axis,
# the clefts between the toes (up to 1.7 cm high) hide their pads. Neighbouring parts overlap at
# each joint (each part is inside the sculpt, so overlap costs nothing), so no wedge at a bend is
# left out of both.
reference = "sculpt-standing.toml"
# Stations every 1.5 cm (1 cm gained nothing measurable, and its tables were at the size where
# building the creature overflows the CPU's 8 MiB stack); each axis runs on 2 cm past its ends,
# and where an end is inside another part, the part sinks by up to 2 mm toward its cap there, so
# it passes under its neighbour before it ends (where it ended proud of it, the lens drew a line).
spacing = 0.015
overlap = 0.02
taper = 0.002

