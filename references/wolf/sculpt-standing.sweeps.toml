# The parts of a replica of sculpt-standing.obj as sweeps (engine/sweep.wrela), for `wrela
# reference replica`: a leg is one sweep from its hip or elbow through its joints to its toes, the
# tail one from its root to its tip; the torso, neck, head and the small parts are straight
# sweeps. Each part's control sections (`sections`, evenly along its path, 4 bumps each) are
# fitted to radii measured in its own planes. Landmarks as in sculpt-standing.parts.toml.
reference = "sculpt-standing.toml"
# Radii measured every centimetre along each path; each path runs on 2 cm past its ends. Parts
# join with 8 mm smooth seams: where several fitted parts overlap (the hindquarters), their
# surfaces cross, and a hard union shows the plates.
spacing = 0.01
overlap = 0.02
seam = 0.008

