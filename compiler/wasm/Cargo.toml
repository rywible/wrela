[package]
name = "wrela-wasm"
description = "The WASM back end: strict floats, integer overflow traps, the command stream writer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-diag.workspace = true
wrela-ir.workspace = true
wrela-abi.workspace = true
wasm-encoder = "0.261"
wasmparser = "0.261"

[lints]
workspace = true

[dev-dependencies]
wat = "1.260"
