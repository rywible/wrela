[package]
name = "wrela-grammar"
description = "The grammar as an executable spec: an oracle parser for spec/grammar.ebnf, grammar-based program generation, and the GBNF export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-diag.workspace = true
wrela-syntax.workspace = true

[[bin]]
name = "differential"
path = "src/bin/differential.rs"
test = false

[[bin]]
name = "export-gbnf"
path = "src/bin/export_gbnf.rs"
test = false

[[bin]]
name = "gbnf-sample"
path = "src/bin/gbnf_sample.rs"
test = false

[lints]
workspace = true
