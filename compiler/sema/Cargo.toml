[package]
name = "wrela-sema"
description = "wrela's semantics: modules and names, types, traits, inference, the memory model and GPU rules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-diag.workspace = true
wrela-syntax.workspace = true
wrela-abi.workspace = true
elsa = "1.11"

[lints]
workspace = true
