[package]
name = "wrela-wgsl"
description = "The WGSL back end: IR to naga IR, validated, written as WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-ir.workspace = true
naga = { version = "30", features = ["wgsl-out", "wgsl-in"] }

[lints]
workspace = true
