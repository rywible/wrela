[package]
name = "wrela-lower"
description = "Monomorphizes checked wrela into IR: instances per target, closures, the GPU entry points and pipelines, and effects per instantiation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-diag.workspace = true
wrela-syntax.workspace = true
wrela-sema.workspace = true
wrela-ir.workspace = true

[lints]
workspace = true
