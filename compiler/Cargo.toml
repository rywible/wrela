[package]
name = "wrela"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Wrela programming language compiler"
repository = "https://github.com/ryanwible/wrela"
build = "build.rs"

[features]
default = []
internal-learned-experiments = []

[[bin]]
name = "wrela"
path = "bin/wrela.rs"

[lib]
path = "lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
wrela_runtime = { path = "../runtime" }
strum = "0.26"
strum_macros = "0.26"
miette = { version = "7", features = ["fancy"] }
thiserror = "1"
smol_str = "0.3.5"
rowan = "0.16.1"
cranelift-codegen = "0.115"
cranelift-frontend = "0.115"
cranelift-module = "0.115"
cranelift-object = "0.115"
target-lexicon = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
sha2 = "0.10"
toml = "0.8"
pollster = "0.4"
wgpu = "29.0.1"
naga = { version = "29.0.1", features = ["wgsl-in"] }
ciborium = "0.2.2"
zstd = "0.13"

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.12.0"
ctor = "0.2.9"
