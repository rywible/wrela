[package]
name = "wrela"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Wrela programming language compiler"
repository = "https://github.com/ryanwible/wrela"

[[bin]]
name = "wrela"
path = "bin/wrela.rs"

[lib]
path = "lib.rs"

[dependencies]
strum = "0.26"
strum_macros = "0.26"
miette = { version = "7", features = ["fancy"] }
thiserror = "1"
smol_str = "0.3.5"
rowan = "0.16.1"
cranelift-codegen = "0.115"
cranelift-frontend = "0.115"
cranelift-module = "0.115"
cranelift-object = "0.115"
target-lexicon = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.12.0"
