[package]
name = "wrela"
description = "The wrela command: check, build and fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wrela"
path = "src/main.rs"

[dependencies]
wrela-diag.workspace = true
wrela-syntax.workspace = true
wrela-driver = { workspace = true, features = ["gpu"] }
wrela-host.workspace = true
wrela-abi.workspace = true
# `wrela run`'s rooms, for a program with a server role.
wrela-serve.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json.workspace = true
sha2 = "0.10"
# A faster allocator than macOS's: the compiler allocates a great deal.
mimalloc.workspace = true
# `wrela tool`'s Ctrl-C: it stops the tool, and the host cleans up after it.
ctrlc = "3"
# The toolchain a workspace pins (`pin`): its release downloaded over HTTPS, and unpacked.
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }

[lints]
workspace = true
