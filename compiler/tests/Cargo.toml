[package]
name = "wrela-tests"
description = "End-to-end tests: wrela programs compiled and run, on the CPU (wasmtime) and the GPU (wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-diag.workspace = true
wrela-driver = { workspace = true, features = ["gpu"] }
wrela-wasm.workspace = true
wrela-sema.workspace = true
wrela-syntax.workspace = true
wrela-grammar.workspace = true
wrela-host.workspace = true
# The server host and a WebTransport client, for the rooms over the network.
wrela-serve.workspace = true
wtransport = { version = "0.7", features = ["self-signed"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wrela-abi.workspace = true
serde_json.workspace = true
wasmtime.workspace = true
# Re-encode a tiny test program with a small heap to force the allocator's real failure path.
wasm-encoder = { version = "0.261", features = ["wasmparser"] }
wasmparser = "0.261"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "0.4"
# The tests' allocator: macOS's spent 30% of the suite's time in malloc, its threads contending.
mimalloc.workspace = true

[lints]
workspace = true
