[package]
name = "wrela-tests"
description = "End-to-end tests: wrela programs compiled and run, on the CPU (wasmtime) and the GPU (wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-diag.workspace = true
wrela-driver.workspace = true
wrela-wasm.workspace = true
wrela-sema.workspace = true
wrela-syntax.workspace = true
wrela-grammar.workspace = true
wrela-host.workspace = true
wrela-abi.workspace = true
serde_json.workspace = true
wasmtime.workspace = true
wrela-wfont.workspace = true
# The reference rasterizer the ui package's text is compared with (AC2).
ab_glyph = "0.2"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "0.4"
# The tests' allocator: macOS's spent 30% of the suite's time in malloc, its threads contending.
mimalloc.workspace = true

[lints]
workspace = true
