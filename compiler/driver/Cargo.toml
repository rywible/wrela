[package]
name = "wrela-driver"
description = "Runs the compiler: loads a package, checks it, builds it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-diag.workspace = true
wrela-syntax.workspace = true
wrela-sema.workspace = true
wrela-ir.workspace = true
wrela-lower.workspace = true
serde.workspace = true
serde_json.workspace = true
wrela-wasm.workspace = true
wrela-wgsl.workspace = true
wrela-abi.workspace = true
# Build-time constants run the program's own code (language.md §10).
wasmtime.workspace = true
# Frame tests run the program's frames on the native host's CPU, without its GPU (§10).
wrela-host = { path = "../../runtime/native", default-features = false }

[features]
# `@test(frames: n, gpu: true)` runs on the native host's GPU (§10): `wrela`'s and the test
# suite's builds have it; the compiler alone doesn't need wgpu.
gpu = ["wrela-host/gpu"]

[lints]
workspace = true
